<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;font-family:'Gowun Batang',serif;background:#1f1e1c}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.top{position:absolute;left:0;right:0;top:0;height:810px;background-size:cover;background-position:center}
.shade{position:absolute;inset:0}
.txt{position:absolute;left:84px;right:84px}
.num{font-family:'Noto Sans KR';font-weight:300;font-size:26px;letter-spacing:6px;opacity:.85}
h1{font-size:104px;font-weight:700;line-height:1.2;letter-spacing:-2px}
h2{font-size:64px;font-weight:700;line-height:1.3;letter-spacing:-1px;margin-top:10px}
p{font-size:36px;line-height:1.7;margin-top:28px;opacity:.95}
.line{width:64px;height:3px;background:#c8553d;margin:34px 0}
</style></head><body>

<div class="card" id="c1">
  <div class="bg" style="background-image:url(path.jpg);background-position:center 40%"></div>
  <div class="shade" style="background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)"></div>
  <div class="txt" style="bottom:120px">
    <div class="num">DAEGU · JUNG-GU</div>
    <div class="line"></div>
    <h1>비 오는 날,<br>청라언덕</h1>
    <p>대구 근대골목을 걷다</p>
  </div>
</div>

<div class="card" id="c2">
  <div class="top" style="background-image:url(food.jpg)"></div>
  <div class="txt" style="top:880px">
    <div class="num">01</div>
    <h2>걷기 전에 든든하게<br>납작만두 한 접시</h2>
    <p>쫄면 곁들이면 대구의 맛 완성</p>
  </div>
</div>

<div class="card" id="c3">
  <div class="top" style="background-image:url(map.jpg);background-position:center 45%"></div>
  <div class="txt" style="top:880px">
    <div class="num">02</div>
    <h2>여기는 청라언덕입니다</h2>
    <p>안내도 따라 언덕 산책을 시작합니다.</p>
  </div>
</div>

<div class="card" id="c4">
  <div class="top" style="background-image:url(house.jpg)"></div>
  <div class="txt" style="top:880px">
    <div class="num">03</div>
    <h2>담쟁이 덮인<br>붉은 벽돌집</h2>
    <p>빗소리와 함께 시간이 천천히 흐르는 곳</p>
  </div>
</div>

<div class="card" id="c5">
  <div class="top" style="height:1040px;overflow:hidden"><div class="bg" style="background-image:url(mansae.jpg);filter:blur(18px) brightness(.9);transform:scale(1.15)"></div></div>
  <div class="top" style="height:1040px;background-image:url(mansae.jpg);background-size:auto 1300px;background-position:center 82%"></div>
  <div class="txt" style="top:1090px">
    <div class="num">04</div>
    <h2>3.1만세운동길</h2>
    <p style="margin-top:14px">백여 년 전 그날을 기억하는 길</p>
  </div>
</div>

<div class="card" id="c6">
  <div class="bg" style="background-image:url(path.jpg);opacity:.22;filter:grayscale(1)"></div>
  <div class="txt" style="top:50%;transform:translateY(-50%);text-align:center">
    <div class="num">청라언덕 · 대구 중구</div>
    <div class="line" style="margin:34px auto"></div>
    <h2 style="font-size:60px;line-height:1.5">비가 와서 더 좋았던<br>근대골목 산책</h2>
  </div>
</div>

</body></html>
