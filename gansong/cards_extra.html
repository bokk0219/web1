<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;font-family:'Gowun Batang',serif;background:#1e1d1b}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.top{position:absolute;left:0;right:0;top:0;height:810px;background-size:cover;background-position:center}
.shade{position:absolute;inset:0}
.txt{position:absolute;left:84px;right:84px}
.num{font-family:'Noto Sans KR';font-weight:300;font-size:26px;letter-spacing:6px;opacity:.85}
h1{font-size:100px;font-weight:700;line-height:1.2;letter-spacing:-2px}
h2{font-size:64px;font-weight:700;line-height:1.3;letter-spacing:-1px;margin-top:10px}
p{font-size:36px;line-height:1.7;margin-top:28px;opacity:.95}
.line{width:64px;height:3px;background:#b8423a;margin:34px 0}
.bot{background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.82) 100%)}
</style></head><body>

<div class="card" id="c1">
  <div class="bg" style="background-image:url(ex_room.jpg);background-position:center 40%"></div>
  <div class="shade bot"></div>
  <div class="txt" style="bottom:120px">
    <div class="num">부록</div>
    <div class="line"></div>
    <h1>작품 하나,<br>방 하나</h1>
    <p>대구간송미술관 미인도실</p>
  </div>
</div>

<div class="card" id="c2">
  <div class="bg" style="background-image:url(ex_woman.jpg);background-position:center 30%"></div>
  <div class="shade bot"></div>
  <div class="txt" style="bottom:110px">
    <div class="num">01</div>
    <h2>신윤복, 미인도</h2>
    <p>이 그림 한 점만을 위한 방</p>
  </div>
</div>

<div class="card" id="c3">
  <div class="txt" style="top:50%;transform:translateY(-50%)">
    <div class="num">02</div>
    <h2 style="font-size:66px">보여주기보다<br>느끼게</h2>
    <div class="line"></div>
    <p style="margin-top:0">사유의 방, 부여 금동대향로 방,<br>이번 청풍계 방과 미인도실까지.</p>
    <p>작품 하나에 방 하나를 내어주는 전시실이<br>늘어가는 것 같다.</p>
    <p>단순히 보여주는 게 아니라<br>느끼게 해주는 큐레이션.<br>좋은 선택과 집중.</p>
  </div>
</div>

<div class="card" id="c4">
  <div class="bg" style="background-image:url(ex_seal.jpg);background-position:center 45%"></div>
</div>

<div class="card" id="c5">
  <div class="top" style="height:900px;background-image:url(ex_cloth.jpg);background-position:center 30%"></div>
  <div class="txt" style="top:960px">
    <div class="num">04</div>
    <h2>고르고 고른 기념품은<br>결국 안경닦이</h2>
    <p style="margin-top:18px">전시회 안경닦이만 벌써 세 장째.<br>양말이나 타월도 팔아주시면 안 될까요.</p>
  </div>
</div>

</body></html>
